<!-- Заявка за резервация: изпраща се веднага, докато клубът потвърди. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 14px;">
  <tr>
    <td style="padding:5px 12px;background:#f6eacb;border-radius:100px;font:700 12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#8a5e04;letter-spacing:.04em;">
      {{status_label}}
    </td>
  </tr>
</table>

<h1 style="margin:0 0 12px;font:800 24px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#12181b;">
  {{heading}}
</h1>
<p style="margin:0 0 20px;font:400 15px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#4b564f;">
  {{intro}}
</p>

<!-- Подробности за резервацията -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;border:1px solid #e7ece8;border-radius:14px;">
  {{#each details}}
  <tr>
    <td style="padding:11px 14px;font:400 13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#7c877f;border-bottom:1px solid #f1f3f1;">
      {{this.label}}
    </td>
    <td align="right" style="padding:11px 14px;font:600 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#12181b;border-bottom:1px solid #f1f3f1;">
      {{this.value}}
    </td>
  </tr>
  {{/each}}
</table>

{{#if cta_url}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px;">
  <tr>
    <td align="center" style="border:1px solid #d7e0da;border-radius:100px;">
      <a href="{{cta_url}}" style="display:inline-block;padding:12px 24px;font:600 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#123b2c;text-decoration:none;border-radius:100px;">
        {{cta_label}}
      </a>
    </td>
  </tr>
</table>
{{/if}}

{{#if note}}
<p style="margin:16px 0 0;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#7c877f;">
  {{note}}
</p>
{{/if}}
