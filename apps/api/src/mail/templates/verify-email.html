<!-- Потвърждение на имейл адрес. -->
<h1 style="margin:0 0 12px;font:800 24px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#12181b;">
  {{heading}}
</h1>
<p style="margin:0 0 20px;font:400 15px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#4b564f;">
  {{intro}}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;">
  <tr>
    <td align="center" bgcolor="#cfea6e" style="border-radius:100px;">
      <a href="{{cta_url}}" style="display:inline-block;padding:13px 26px;font:700 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#123b2c;text-decoration:none;border-radius:100px;">
        {{cta_label}}
      </a>
    </td>
  </tr>
</table>

<!-- Клиенти, които не рендират бутона, трябва да виждат самия адрес. -->
<p style="margin:0 0 6px;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#7c877f;">
  Ако бутонът не работи, отворете този адрес в браузъра си:
</p>
<p style="margin:0 0 16px;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1e6b47;word-break:break-all;">
  <a href="{{cta_url}}" style="color:#1e6b47;text-decoration:underline;">{{cta_url}}</a>
</p>

<p style="margin:0;padding:12px 14px;background:#f3f7f4;border-radius:12px;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#4b564f;">
  {{expiry_note}}
</p>

{{#if note}}
<p style="margin:16px 0 0;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#7c877f;">
  {{note}}
</p>
{{/if}}
