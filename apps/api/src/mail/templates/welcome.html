<!-- Регистрация: акаунтът е готов. -->
<h1 style="margin:0 0 12px;font:800 24px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#12181b;">
  {{heading}}
</h1>
<p style="margin:0 0 16px;font:400 15px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#4b564f;">
  {{intro}}
</p>

{{#if steps}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;">
  {{#each steps}}
  <tr>
    <td width="26" valign="top" style="padding:6px 0;font:700 15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1e6b47;">
      {{this.number}}.
    </td>
    <td style="padding:6px 0;font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#12181b;">
      {{this.text}}
    </td>
  </tr>
  {{/each}}
</table>
{{/if}}

{{#if cta_url}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 8px;">
  <tr>
    <td align="center" bgcolor="#cfea6e" style="border-radius:100px;">
      <a href="{{cta_url}}" style="display:inline-block;padding:13px 26px;font:700 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#123b2c;text-decoration:none;border-radius:100px;">
        {{cta_label}}
      </a>
    </td>
  </tr>
</table>
{{/if}}

{{#if note}}
<p style="margin:16px 0 0;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#7c877f;">
  {{note}}
</p>
{{/if}}
